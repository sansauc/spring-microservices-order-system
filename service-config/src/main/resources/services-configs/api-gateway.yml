server:
  port: 8060

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    registryFetchIntervalSeconds: 30
    registerWithEureka: true

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          routes:
            - id: service-product
              uri: lb://service-product
              predicates:
                - Path=/api/v1/products, /api/v1/products/**
            - id: service-customer
              uri: lb://service-customer
              predicates:
                - Path=/api/v1/customers, /api/v1/customers/**
            - id: service-order
              uri: lb://service-order
              predicates:
                - Path=/api/v1/orders, /api/v1/orders/**
